name: Expiry check

# On the first of every month. When something expires within 30 days the run fails, and GitHub emails me.
on:
  schedule:
    - cron: "17 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check security.txt and the deploy token
        run: node tools/check-expiry.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
