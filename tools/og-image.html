<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Link preview image</title>
  <!--
    Source of public/og.png and public/og-es.png, the images apps show when a link to the site is shared.
    It draws the same glyph field as the home page, frozen with a patch of lit glyphs.
    Open it as og-image.html for the English image and og-image.html?lang=es for the Spanish one.
    See the README for the command that renders them.
  -->
  <style>
    @font-face {
      font-family: "Geist";
      font-weight: 100 900;
      src: url("../public/fonts/geist-latin-wght-normal.woff2") format("woff2");
    }

    @font-face {
      font-family: "Geist Mono";
      font-weight: 100 900;
      src: url("../public/fonts/geist-mono-latin-wght-normal.woff2") format("woff2");
    }

    /* The colours of the graphite bands of the dark theme, with its touch of petrol in the light. */
    :root {
      --bg: #141618;
      --text: #edeef0;
      --muted: #c6c7ca;
      --faint: #9d9ea2;
      --rule: #3b3e41;
      --glow: #e5e8eb;
      --glyph: rgba(198, 199, 202, 0.11);
      --light: rgba(81, 120, 136, 0.16);
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Geist", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    canvas {
      position: absolute;
      inset: 0;
    }

    .card {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 54px 80px 70px;
    }

    .home {
      align-self: flex-start;
      font: 400 22px/1 "Geist Mono", monospace;
      letter-spacing: -0.01em;
    }

    .home span {
      color: var(--faint);
    }

    .hero {
      margin-top: auto;
    }

    .name {
      margin: 0;
      font-size: 156px;
      font-weight: 600;
      line-height: 0.9;
      letter-spacing: -0.05em;
    }

    .name span {
      display: block;
      width: max-content;
    }

    .lead {
      max-width: 900px;
      margin: 30px 0 0;
      font: 400 31px/1.35 "Geist", sans-serif;
      letter-spacing: -0.012em;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <canvas width="1200" height="630"></canvas>
  <div class="card">
    <div class="home" data-shield>mariohdz<span>.com</span></div>
    <div class="hero">
      <h1 class="name"><span data-shield>Mario</span><span data-shield>Hernández</span></h1>
      <p class="lead"><span data-shield data-lead>Websites, business email, AI and automation for small businesses and independent professionals.</span></p>
    </div>
  </div>
  <script>
    // The Spanish image only changes the words.
    if (new URLSearchParams(location.search).get("lang") === "es") {
      document.documentElement.lang = "es";
      document.querySelector("[data-lead]").textContent =
        "Sitios web, correo profesional, IA y automatizaciones para pequeños negocios y profesionales independientes.";
    }
  </script>
  <script>
    const GLYPHS = "01<>/\\|{}[]()+=-_*~:;.#$%&@!?";
    const WIDTH = 1200;
    const HEIGHT = 630;
    const CELL_W = 20;
    const CELL_H = 25;
    const FONT_SIZE = 14;
    const MONO = '"Geist Mono", monospace';

    // A fixed seed, so the same source always renders the same image.
    let seed = 20261105;
    const random = () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const randomGlyph = () => GLYPHS[Math.floor(random() * GLYPHS.length)];

    document.fonts.ready.then(() => {
      const root = getComputedStyle(document.documentElement);
      const glyphColor = root.getPropertyValue("--glyph").trim();
      const glowColor = root.getPropertyValue("--glow").trim();
      const lightColor = root.getPropertyValue("--light").trim();
      const ctx = document.querySelector("canvas").getContext("2d");
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const cols = Math.ceil(WIDTH / CELL_W);
      const rows = Math.ceil(HEIGHT / CELL_H);

      // Glyphs behind text stay dim, as on the site.
      const shield = new Float32Array(cols * rows).fill(1);
      const range = document.createRange();
      const pad = 8;
      for (const element of document.querySelectorAll("[data-shield]")) {
        range.selectNodeContents(element);
        for (const rect of range.getClientRects()) {
          const c0 = Math.max(0, Math.floor((rect.left - pad) / CELL_W));
          const c1 = Math.min(cols - 1, Math.floor((rect.right + pad) / CELL_W));
          const r0 = Math.max(0, Math.floor((rect.top - pad) / CELL_H));
          const r1 = Math.min(rows - 1, Math.floor((rect.bottom + pad) / CELL_H));
          for (let row = r0; row <= r1; row++) shield.fill(0.15, row * cols + c0, row * cols + c1 + 1);
        }
      }

      // Where the pointer would be: the soft light and the lit glyphs around it.
      const lightX = 930;
      const lightY = 200;
      const radius = 230;
      const light = ctx.createRadialGradient(lightX, lightY, 0, lightX, lightY, 520 * 0.65);
      light.addColorStop(0, lightColor);
      light.addColorStop(1, "transparent");
      ctx.fillStyle = light;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      for (let row = 0, i = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++, i++) {
          const x = (col + 0.5) * CELL_W;
          const y = (row + 0.5) * CELL_H;
          // The field fades out towards the bottom, like the hero's mask.
          const fade = y < HEIGHT * 0.55 ? 1 : Math.max(0, 1 - (y - HEIGHT * 0.55) / (HEIGHT * 0.45));
          const shade = 0.3 + random() * 0.7;
          const glyph = randomGlyph();
          const distance = Math.hypot(x - lightX, y - lightY);
          let heat = distance < radius ? (1 - distance / radius) ** 2 : 0;
          // A few scattered glyphs twinkle, away from the text at the bottom.
          if (!heat && shield[i] === 1 && fade > 0.8 && random() < 0.012) heat = 0.25 + random() * 0.45;

          if (heat < 1) {
            ctx.globalAlpha = (1 - heat) * shade * shield[i] * fade;
            ctx.fillStyle = glyphColor;
            ctx.font = `400 ${FONT_SIZE}px ${MONO}`;
            ctx.fillText(glyph, x, y);
          }
          if (heat > 0.01) {
            ctx.globalAlpha = Math.min(1, heat * 1.25) * (shield[i] < 1 ? 0.3 : 1) * fade;
            ctx.fillStyle = glowColor;
            ctx.font = `${heat > 0.6 ? 700 : heat > 0.3 ? 500 : 400} ${FONT_SIZE}px ${MONO}`;
            ctx.fillText(heat > 0.3 ? randomGlyph() : glyph, x, y);
          }
        }
      }
      ctx.globalAlpha = 1;
    });
  </script>
</body>
</html>
